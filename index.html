<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Birthday, Nathan!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Editorial Print Magazine Typography: Playfair Display, Oswald, Plus Jakarta Sans, Caveat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper-cream: #FFFDF7;
      --paper-butter: #FDF6C7;
      --paper-pink: #FCE0EE;
      --paper-lavender: #EADCF8;
      --paper-mint: #DCF2D3;
      --paper-peach: #FCE2CC;
      --magenta: #E1278A;
      --ink: #272226;
      --ink-soft: #5C535A;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--paper-cream);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    .font-serif-ed {
      font-family: 'Playfair Display', Georgia, serif;
    }

    .font-cond {
      font-family: 'Oswald', sans-serif;
      letter-spacing: 0.03em;
    }

    .font-hand {
      font-family: 'Caveat', cursive;
    }

    .paper-sheet {
      background-color: var(--paper-cream);
      background-image: radial-gradient(rgba(225, 39, 138, 0.05) 1px, transparent 1px);
      background-size: 18px 18px;
    }

    .mag-card {
      border: 1.5px solid rgba(225, 39, 138, 0.22);
      box-shadow: 0 10px 26px -6px rgba(62, 42, 56, 0.10), 0 2px 6px rgba(62, 42, 56, 0.05);
    }

    .mag-cutout {
      border: 1.5px solid rgba(225, 39, 138, 0.28);
      box-shadow: 0 6px 16px -4px rgba(225, 39, 138, 0.14);
    }

    .pastel-grad-pink {
      background: linear-gradient(135deg, #FFF5FA 0%, #FCE0EE 55%, #EADCF8 100%);
    }

    .pastel-grad-butter {
      background: linear-gradient(135deg, #FFFDF5 0%, #FDF6C7 55%, #FCE2CC 100%);
    }

    .pastel-grad-mint {
      background: linear-gradient(135deg, #F7FDF4 0%, #DCF2D3 60%, #FDF6C7 100%);
    }

    .pastel-grad-lavender {
      background: linear-gradient(135deg, #F9F5FF 0%, #EADCF8 55%, #FCE0EE 100%);
    }

    /* Clean Static Passcode Gate */
    .passcode-gate {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: #FCE0EE;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      user-select: none;
    }

    .passcode-gate.is-hidden {
      display: none;
    }

    .gate-card {
      background: #FFFDF7;
      border: 1.5px solid rgba(225, 39, 138, 0.28);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 30px rgba(39, 34, 38, 0.08);
    }

    .gate-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 250px;
      margin: 16px auto 0;
    }

    .gate-key {
      padding: 12px 0;
      border-radius: 12px;
      border: 1.5px solid rgba(225, 39, 138, 0.25);
      background: #FFFFFF;
      color: #272226;
      font-family: 'Oswald', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .gate-key:active {
      background: #FCE0EE;
    }

    /* Minimal Intro Welcome Overlay */
    .intro-overlay {
      background:
        radial-gradient(circle at 18% 22%, rgba(252, 224, 238, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 82% 78%, rgba(253, 246, 199, 0.30) 0%, transparent 50%),
        linear-gradient(155deg, #35473C 0%, #445A4D 55%, #2C3B32 100%);
      transition: opacity 0.65s ease, visibility 0.65s;
    }
    .intro-overlay.hidden-intro {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Articulated Animated Walking Nathan SVG */
    @keyframes idleBreathe {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2.5px); }
    }

    @keyframes walkBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    @keyframes leftLegWalk {
      0%, 100% { transform: rotate(-18deg); }
      50% { transform: rotate(18deg); }
    }

    @keyframes rightLegWalk {
      0%, 100% { transform: rotate(18deg); }
      50% { transform: rotate(-18deg); }
    }

    @keyframes leftArmWalk {
      0%, 100% { transform: rotate(14deg); }
      50% { transform: rotate(-14deg); }
    }

    @keyframes rightArmWalk {
      0%, 100% { transform: rotate(-14deg); }
      50% { transform: rotate(14deg); }
    }

    @keyframes floatBubble {
      0%, 100% { transform: translate(-50%, 0px); }
      50% { transform: translate(-50%, -4px); }
    }

    @keyframes softPulse {
      0% { transform: scale(0.95); opacity: 0.75; }
      70% { transform: scale(1.38); opacity: 0; }
      100% { transform: scale(1.38); opacity: 0; }
    }

    @keyframes swayGentle {
      0%, 100% { transform: rotate(-3.5deg); }
      50% { transform: rotate(3.5deg); }
    }

    .char-idle #nathan-body-group {
      animation: idleBreathe 2.4s ease-in-out infinite;
    }

    .char-walking #nathan-body-group {
      animation: walkBob 0.36s ease-in-out infinite;
    }
    .char-walking #nathan-leg-left {
      transform-origin: 28px 58px;
      animation: leftLegWalk 0.36s ease-in-out infinite;
    }
    .char-walking #nathan-leg-right {
      transform-origin: 36px 58px;
      animation: rightLegWalk 0.36s ease-in-out infinite;
    }
    .char-walking #nathan-arm-left {
      transform-origin: 20px 38px;
      animation: leftArmWalk 0.36s ease-in-out infinite;
    }
    .char-walking #nathan-arm-right {
      transform-origin: 44px 38px;
      animation: rightArmWalk 0.36s ease-in-out infinite;
    }

    .speech-bubble {
      animation: floatBubble 2.4s ease-in-out infinite;
    }
    .landmark-pulse::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 9999px;
      border: 2px solid var(--magenta);
      animation: softPulse 2.2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
      pointer-events: none;
    }
    .flower-sway {
      transform-origin: bottom center;
      animation: swayGentle 3.5s ease-in-out infinite;
    }

    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #FAF4E8; }
    ::-webkit-scrollbar-thumb { background: #E1278A; border-radius: 9999px; }
  </style>
</head>
<body class="paper-sheet selection:bg-[#E1278A] selection:text-white">

  <!-- =====================================================================

  <!-- =====================================================================

    /* =====================================================================
       CLEAN TEXT & BUTTON PASSCODE GATE ENGINE (060626)
       ===================================================================== */
    function initPasscodeGate() {
      const gate = document.getElementById("passcode-gate");
      const slots = document.querySelectorAll(".pin-slot");
      const feedback = document.getElementById("passcode-feedback");
      let enteredPin = "";
      let isUnlocked = sessionStorage.getItem("nathans24th_unlocked_060626") === "true";

      if (isUnlocked) {
        gate.classList.add("is-hidden");
        return;
      }

      function updateSlots() {
        slots.forEach((slot, idx) => {
          const digit = enteredPin[idx];
          if (digit !== undefined) {
            slot.textContent = "*";
            slot.classList.add("border-[#E1278A]", "bg-[#FCE0EE]", "text-[#E1278A]");
          } else {
            slot.textContent = "";
            slot.classList.remove("border-[#E1278A]", "bg-[#FCE0EE]", "text-[#E1278A]");
          }
        });
      }

      function handleDigit(d) {
        if (isUnlocked || enteredPin.length >= 6) return;
        enteredPin += d;
        feedback.textContent = "";
        updateSlots();

        if (enteredPin.length === 6) {
          if (enteredPin === CONTENT_CONFIG.passcode.secret) {
            isUnlocked = true;
            sessionStorage.setItem("nathans24th_unlocked_060626", "true");
            gate.classList.add("is-hidden");
          } else {
            feedback.textContent = CONTENT_CONFIG.passcode.wrongMessage;
            enteredPin = "";
            updateSlots();
          }
        }
      }

      document.querySelectorAll(".pin-key").forEach(btn => {
        btn.addEventListener("click", () => handleDigit(btn.dataset.key));
      });

      document.getElementById("pin-clear-btn").addEventListener("click", () => {
        if (isUnlocked) return;
        enteredPin = "";
        feedback.textContent = "";
        updateSlots();
      });

      document.getElementById("pin-back-btn").addEventListener("click", () => {
        if (isUnlocked) return;
        enteredPin = enteredPin.slice(0, -1);
        feedback.textContent = "";
        updateSlots();
      });

      window.addEventListener("keydown", (e) => {
        if (isUnlocked) return;
        if (/^[0-9]$/.test(e.key)) {
          handleDigit(e.key);
        } else if (e.key === "Backspace") {
          enteredPin = enteredPin.slice(0, -1);
          feedback.textContent = "";
          updateSlots();
        } else if (e.key === "Escape") {
          enteredPin = "";
          feedback.textContent = "";
          updateSlots();
        }
      });
    }

    function walkCharacterTo(xPct, yPx, bubbleText = null, milestoneToOpen = null) {
      playerState.targetXPct = Math.max(18, Math.min(82, xPct));
      playerState.targetYPx = Math.max(95, Math.min(1560, yPx));
      playerState.isWalking = true;
      playerState.pendingMilestone = milestoneToOpen;
      if (bubbleText) setSpeechBubble(bubbleText);
      document.getElementById("avatar-sprite-wrap").className = "char-walking";
    }

    function walkToMilestone(num) {
      const stop = MILESTONE_STOPS[num];
      if (!stop) return;
      walkCharacterTo(stop.roadX, stop.roadY, stop.bubble, num);
    }

    function gameLoop() {
      if (playerState.isWalking) {
        const dx = playerState.targetXPct - playerState.xPct;
        const dy = playerState.targetYPx - playerState.yPx;
        const dist = Math.hypot(dx * 5, dy);

        if (dist < 4) {
          playerState.xPct = playerState.targetXPct;
          playerState.yPx = playerState.targetYPx;
          playerState.isWalking = false;
          document.getElementById("avatar-sprite-wrap").className = "char-idle";

          if (playerState.pendingMilestone) {
            const m = playerState.pendingMilestone;
            playerState.pendingMilestone = null;
            setTimeout(() => openMilestoneModal(m), 220);
          }
        } else {
          const speed = Math.min(7.2, Math.max(3.0, dist * 0.062));
          const angle = Math.atan2(dy, dx * 5);
          playerState.xPct += (Math.cos(angle) * speed) / 5;
          playerState.yPx += Math.sin(angle) * speed;

          const avatarEl = document.getElementById("player-avatar");
          const rect = avatarEl.getBoundingClientRect();
          const idealY = window.innerHeight * 0.48;
          if (Math.abs(rect.top - idealY) > 90) {
            window.scrollBy({ top: (rect.top - idealY) * 0.08, behavior: "auto" });
          }
        }

        const avatar = document.getElementById("player-avatar");
        avatar.style.left = `${playerState.xPct}%`;
        avatar.style.top = `${playerState.yPx}px`;
      }

      requestAnimationFrame(gameLoop);
    }

    function bindEvents() {
      document.getElementById("start-walk-btn").addEventListener("click", () => {
        document.getElementById("intro-screen").classList.add("hidden-intro");
        setSpeechBubble("Happy Birthday, Nathan!");
      });

      document.getElementById("road-clickable-path").addEventListener("click", (e) => {
        const stageRect = document.getElementById("world-stage").getBoundingClientRect();
        const clickX = ((e.clientX - stageRect.left) / stageRect.width) * 100;
        const clickY = e.clientY - stageRect.top;
        walkCharacterTo(clickX, clickY, "Walking down the street...");
      });

      document.querySelectorAll(".milestone-card").forEach(card => {
        card.addEventListener("click", (e) => {
          e.stopPropagation();
          const m = Number(card.dataset.milestone);
          walkToMilestone(m);
        });
      });

      document.getElementById("back-to-road-btn").addEventListener("click", closeMilestoneModal);
      document.getElementById("next-stop-btn").addEventListener("click", () => {
        const next = currentOpenMilestone < 5 ? currentOpenMilestone + 1 : 1;
        closeMilestoneModal();
        setTimeout(() => walkToMilestone(next), 220);

    }

            <h2 class="font-serif-ed text-3xl sm:text-4xl font-bold text-[#272226] mt-2">
              Nathan does not own the cats, <span class="italic text-[#E1278A]">he works for them.</span>
            </h2>
            <p class="text-xs sm:text-sm text-[#5C535A] mt-1.5">
              Tap each cat below:
            </p>
          </div>

          <div class="my-5 grid grid-cols-2 sm:grid-cols-5 gap-3 max-w-4xl mx-auto w-full">
            ${cats.map((c, idx) => `
              <button data-cat-idx="${idx}"
                style="background:${c.bg};"
                class="cat-btn p-4 rounded-3xl mag-card flex flex-col items-center text-center transition transform hover:-translate-y-1 cursor-pointer">
                ${catSvgs[idx]}
                <span class="mt-2 font-cond font-bold text-sm text-[#272226]">${c.name}</span>
                <span class="font-cond text-[9px] uppercase tracking-wider text-[#E1278A] mt-0.5">${c.role}</span>
              </button>
            `).join("")}
          </div>

          <div class="max-w-2xl mx-auto w-full bg-white/95 p-5 rounded-3xl mag-card text-center">
            <span id="cat-detail-title" class="font-cond font-bold text-sm text-[#E1278A] uppercase tracking-wider">
              OREO : THE BOOMER BOSS
            </span>
            <p id="cat-detail-desc" class="text-xs sm:text-sm text-[#272226] mt-1.5 leading-relaxed">
              ${cats[0].desc}
            </p>
          </div>
        </div>
      `;

      container.querySelectorAll(".cat-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const c = cats[Number(btn.dataset.catIdx)];
          document.getElementById("cat-detail-title").textContent = `${c.name} : ${c.role}`;
          document.getElementById("cat-detail-desc").textContent = c.desc;
        });
      });
    }

    /* =====================================================================
       STOP 04: THE MIND (NO TOP PART, NO HEART, NO FINAL VERDICT)
       ===================================================================== */
    function renderScene4TheMind(container) {
      const m = CONTENT_CONFIG.theMind;
      container.innerHTML = `
        <div class="pastel-grad-pink min-h-[540px] p-6 sm:p-10 flex flex-col justify-center">
          <div class="max-w-3xl mx-auto w-full bg-white/95 p-6 sm:p-9 rounded-3xl mag-card">
            <h2 class="font-serif-ed text-4xl sm:text-5xl font-bold text-[#E1278A] tracking-tight">
              ${m.title}
            </h2>

            <p class="mt-4 text-xs sm:text-sm text-[#272226] leading-relaxed">
              ${m.story}
            </p>

            <div class="mt-6 grid grid-cols-1 sm:grid-cols-3 gap-3.5">
              ${m.highlights.map(h => `
                <div class="p-4 rounded-2xl pastel-grad-butter mag-cutout">
                  <span class="font-cond font-bold text-xs text-[#E1278A] uppercase tracking-wider">
                    ${h.label}
                  </span>
                  <p class="text-xs text-[#272226] mt-1.5 leading-relaxed">
                    ${h.text}
                  </p>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    /* =====================================================================
       STOP 05: WISHES (WITH COPY-AND-SEND WISH BOX AT THE END)
       ===================================================================== */
    function renderScene5Wishes(container) {
      const w = CONTENT_CONFIG.wishes;
      container.innerHTML = `
        <div class="paper-sheet min-h-[540px] p-5 sm:p-8 flex flex-col items-center justify-between">
          <!-- Teal Envelope with Pink/White Star Seal -->
          <div class="w-full max-w-md mb-5">
            <svg viewBox="0 0 360 150" class="w-full h-auto drop-shadow-md">
              <rect x="10" y="8" width="340" height="134" rx="4" fill="#6DA3A6" stroke="#272226" stroke-width="1.5"/>
              <path d="M10 8 L180 94 L350 8" fill="#6DA3A6" stroke="#272226" stroke-width="1.5"/>
              <polygon points="180,66 187,83 205,83 190,94 196,111 180,100 164,111 170,94 155,83 173,83" fill="#F472B6" stroke="#FFFFFF" stroke-width="3"/>
            </svg>
          </div>

          <div class="max-w-4xl w-full bg-white/95 p-6 sm:p-8 rounded-3xl mag-card">
            <h2 class="font-hand text-4xl sm:text-5xl font-bold text-[#272226] mb-3">
              ${w.greeting}
            </h2>

            <!-- Apology Note -->
            <div class="mb-5 p-4 rounded-2xl pastel-grad-pink border border-[#E1278A]/25">
              <p class="text-xs sm:text-sm font-medium text-[#272226] leading-relaxed">
                ${w.apologyNote}
              </p>
            </div>

            <!-- 3-Column Birthday Letter -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5 text-xs text-[#272226] leading-relaxed">
              <p>${w.col1}</p>
              <p>${w.col2}</p>
              <p>${w.col3}</p>
            </div>

            <!-- Simple Copy & Send Birthday Wish Box -->
            <div class="mt-6 pt-5 border-t border-[#E1278A]/20 text-center">
              <div class="max-w-lg mx-auto pastel-grad-butter p-5 rounded-3xl mag-card text-left">
                <p class="font-cond text-xs uppercase tracking-widest text-[#E1278A] mb-1">
                  YOUR 24TH BIRTHDAY WISH
                </p>
                <p class="text-xs text-[#5C535A] mb-2.5">
                  Write your wish below, copy it, and send it to Noveline:
                </p>
                <textarea id="wish-message-input" rows="3"
                  placeholder="Write your 24th birthday wish here..."
                  class="w-full p-3 rounded-2xl bg-white border border-[#E1278A]/30 text-xs sm:text-sm text-[#272226] focus:outline-none focus:border-[#E1278A]"></textarea>

                <div class="mt-3 flex justify-end">
                  <button type="button" id="copy-wish-btn"
                    class="px-6 py-2.5 rounded-full bg-[#E1278A] hover:bg-[#c81e79] text-white font-cond text-xs uppercase tracking-[0.16em] shadow-md cursor-pointer transition active:scale-95">
                    Copy Wish to Send to Noveline
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById("copy-wish-btn").addEventListener("click", () => {
        const inputEl = document.getElementById("wish-message-input");
        const wishText = inputEl.value.trim() || "Happy 24th! Here is my birthday wish:";
        inputEl.value = wishText;
        inputEl.select();
        document.execCommand("copy");
        showLoveToast("Copied! Paste and send it to Noveline");
      });
    }
  </script>
